      <stop offset="0.35" stop-color="#2f6fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoVermelho" cx="0.5" cy="0.5" r="0.5">
